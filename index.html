<!doctype html>

<html lang="en-US">

<head>
	<title data-i18n="pageTitle">Gwent Classic from The Witcher 3: Wild Hunt</title>
	<meta charset="utf-8" />
	<meta name="author" content="Arun Sundaram" />
	<meta name="description" content="Play the original Gwent minigame from The Witcher 3 in your browser! Includes cards from Hearts of Stone and Blood & Wine!" />
	<meta name="keywords" content="arun, sundaram, programmer, gwent, tw3, witcher, card, game, gamedev, play" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>

<div id="dimensions" style="position:fixed;width:100vw;height:calc(100vw * 1080 / 1920);"></div>

<audio id="bg-music" preload="none"></audio>

<main>

	<section id="click-background" class="noclick"></section>

	<section id="panel-left" class="panel">

		<div id="exit-game" data-i18n-title="exitGame"></div>
	
		<div id="leader-op" class="leader-box">
			<div class="leader-container center" data-i18n-title="viewLeader"> 
			</div>
			<div class="leader-active">
				<div></div>
			</div>
		</div>
		
		<section id="stats-op" class="stats">
			<div class="profile-img">
				<div><div></div></div>
			</div>
			
			<div id="name-op" class="name"></div>
			<div id="deck-name-op" class="deck-name"></div>
			
			<div id="hand-count-op" class="hand-count">6</div>
			
			<div id="gem1-op" class="gem gem-on bg-contain"></div>
			<div id="gem2-op" class="gem gem-on bg-contain"></div>
			
			<div id="score-total-op" class="score-total"><div class="center">0</div></div>
			
			<div id="passed-op" data-i18n="passed"></div>
			
		</section>
		
		<div id="weather" class="card-container">
		</div>
		
		<section id="stats-me" class="stats">
			<div class="profile-img">
				<div><div></div></div>
			</div>
			<div id="passed-me" data-i18n="passed"></div>
			<div id="hand-count-me" class="hand-count">5</div>
			
			<div id="gem1-me" class="gem gem-on bg-contain"></div>
			<div id="gem2-me" class="gem gem-on bg-contain"></div>
			
			<div id="name-me" class="name"></div>
			<div id="deck-name-me" class="deck-name"></div>
			
			<div id="score-total-me" class="score-total"><div class="center">0</div></div>
			
			
		</section>
		
		<div id="leader-me" class="leader-box">
			<div class="leader-container center" data-i18n-title="playLeader"></div>
			<div class="leader-active">
				<div></div>
			</div>
		</div>
		
		<div id="pass-button" class="center" data-i18n-title="passRound" data-i18n="pass"></div>
		
	</section>
	
	<section id="panel-mid" class="panel">
		<section id="field-op" class="field">
			<div class="field-row" data-row="siege">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
			<div class="field-row" data-row="ranged">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
			<div class="field-row" data-row="close">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
		</section>
		
		<section id="field-me" class="field">
			<div class="field-row" data-row="close">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
			<div class="field-row" data-row="ranged">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
			<div class="field-row" data-row="siege">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
		</section>
		
		<section id="field-hand">
			<div id="hand-row" class="card-container card-selectable">
			</div>
		</section>
	</section>
	
	<section id="panel-right" class="panel">
		<div id="grave-op" class="grave cardpile" data-i18n-title="viewDiscards">
		</div>
		<div id="deck-op" class="cardpile">
		
		</div>
		<div id="grave-me" class="grave cardpile" data-i18n-title="viewDiscards">
		</div>
		<div id="deck-me" class="cardpile">
		</div>
	</section>
	
	<div id="hand-op"></div>
	
	<section class="card-preview hide">
		<div class="card-lg"></div>
		<div class="card-description">
			<div></div>
			<h1></h1>
			<p></p>
		</div>
	</section>
	
	<section id="carousel" class="hide">
		<div>
			<div class="card-lg" onclick="Carousel.curr.shift(event,-2)" onmouseover="Carousel.curr?.nudge(-2)"></div>
			<div class="card-lg" onclick="Carousel.curr.shift(event,-1)" onmouseover="Carousel.curr?.nudge(-1)"></div>
			<div class="card-lg" onclick="Carousel.curr.select(event)"   onmouseover="Carousel.curr?.nudge( 0)"></div>
			<div class="card-lg" onclick="Carousel.curr.shift(event, 1)" onmouseover="Carousel.curr?.nudge( 1)"></div>
			<div class="card-lg" onclick="Carousel.curr.shift(event, 2)" onmouseover="Carousel.curr?.nudge( 2)"></div>
		</div>
		<div class="card-description">
			<div></div>
			<h1></h1>
			<p></p>
		</div>
		<div></div>
	</section>
	
	
	<section id="popup" class="center hide">
		<div>
			<h3></h3>
			<p></p>
			<div>
				<button onclick="Popup.curr.selectYes()"></button>
				<button onclick="Popup.curr.selectNo()"></button>
			</div>
		</div>
	</section>
	
	
	<section id="notification-bar" class="hide">
		<div></div>
	</section>
	
	<section id="end-screen" class="hide">
		<div></div>
		<table>
			<colgroup>
				<col span="3" />
				<col span="1" />
				<col span="1" />
				<col span="1" />
			</colgroup>
			<tbody>
				<tr>
					<th colspan="2"></th>
					<th data-i18n="round1"></th>
					<th data-i18n="round2"></th>
					<th data-i18n="round3"></th>
				</tr>
				<tr>
					<th colspan="2"></th>
					<td>0</td>
					<td>0</td>
					<td>0</td>
				</tr>
				<tr>
					<th colspan="2"></th>
					<td>0</td>
					<td>0</td>
					<td>0</td>
				</tr>
			</tbody>
		</table>
		<p class="hide" data-i18n="drawMessage"></p>
		<button data-i18n="customize"></button>
		<button data-i18n="rematch"></button>
		<button data-i18n="newGame"></button>
	</section>
	
	<section id="deck-selector">
		
	</section>
	

</main>

<section id="deck-customization">
	<div id="faction-title" class="center">
		<h1></h1>
	</div>
	<p id="faction-description"></p>

	<a id="toggle-fullscreen" data-i18n="exitFullscreen"></a>
	
	<label id="upload-deck" class="deck-options">
		<input type="file" id="add-file" value="Import" style="display:none;"/>
		<span data-i18n="uploadDeck"></span>
	</label>
	
	<a id="change-faction" class="deck-options" data-i18n="changeFaction"></a>
	
	<a id="download-deck" class="deck-options" data-i18n="downloadDeck"></a>
	<a id="download-json" style="display:none;"></a>
	
	<h2 id="card-bank-title" class="card-contianer-title" data-i18n="cardCollection"></h2>
	<h2 id="card-deck-title" class="card-contianer-title" data-i18n="cardsInDeck"></h2>
	<p id="card-bank-filter-name" class="card-filter-name" data-i18n="filterAll"></p>
	<p id="card-deck-filter-name" class="card-filter-name" data-i18n="filterAll"></p>
	<div id="card-bank-filters" class="card-filters"></div>
	<div id="card-deck-filters" class="card-filters"></div>
	<!-- Filter tab icons, drawn after the ones in The Witcher 3's deck builder -->
	<svg id="deck-filter-icons" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
		<defs>
			<mask id="filter-icon-all-mask">
				<rect width="24" height="24" fill="#fff"/>
				<rect x="7.4" y="5" width="13.2" height="17.2" rx="2.2" fill="#000" transform="rotate(10 14 13.6)"/>
			</mask>
		</defs>
		<symbol id="filter-icon-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
			<g mask="url(#filter-icon-all-mask)"><rect x="3.6" y="2.2" width="11" height="15" rx="1.4" transform="rotate(-10 9.1 9.7)"/></g>
			<rect x="8.5" y="6.1" width="11" height="15" rx="1.4" transform="rotate(10 14 13.6)"/>
		</symbol>
		<symbol id="filter-icon-close" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-linecap="round">
			<polygon points="21,3 19.1,7.1 11.1,15.1 8.9,12.9 16.9,4.9" stroke="none"/>
			<line x1="6.6" y1="11.6" x2="12.4" y2="17.4" stroke-width="2.2"/>
			<line x1="9.5" y1="14.5" x2="5" y2="19" stroke-width="2"/>
			<circle cx="4.1" cy="19.9" r="1.7" stroke="none"/>
		</symbol>
		<symbol id="filter-icon-ranged" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
			<path d="M4.5 3.5 C14 3.5 20.5 10 20.5 19.5" stroke-width="2.1"/>
			<line x1="4.5" y1="3.5" x2="20.5" y2="19.5" stroke-width=".9"/>
			<line x1="4" y1="20" x2="18" y2="6" stroke-width="1.4"/>
			<polygon points="20.3,3.7 15.6,5.1 18.9,8.4" fill="currentColor" stroke="none"/>
			<path d="M6.2 17.8 L3.6 17.2 M6.2 17.8 L6.8 20.4 M7.8 16.2 L5.2 15.6 M7.8 16.2 L8.4 18.8" stroke-width="1.1"/>
		</symbol>
		<symbol id="filter-icon-siege" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-linecap="round">
			<circle cx="6.5" cy="19.6" r="2.3" stroke="none"/>
			<circle cx="17.5" cy="19.6" r="2.3" stroke="none"/>
			<rect x="2.5" y="15.4" width="19" height="2.6" rx=".9" stroke="none"/>
			<path d="M10.5 15.6 L15 7.5 L19.5 15.6 M12.6 12 H17.4" fill="none" stroke-width="2"/>
			<line x1="4.2" y1="5.4" x2="18" y2="15.4" stroke-width="2"/>
			<path d="M1.6 3 L7.2 3.6 L4.4 7.6 Z" stroke="none"/>
		</symbol>
		<symbol id="filter-icon-hero" viewBox="0 0 24 24" fill="currentColor">
			<path fill-rule="evenodd" d="M12 1.6 C16.4 2.4 19 5.2 19 9.2 V15.4 C19 17.6 16 19.4 12 20 C8 19.4 5 17.6 5 15.4 V9.2 C5 5.2 7.6 2.4 12 1.6 Z M6.6 9.6 H11.2 V11.1 H6.6 Z M12.8 9.6 H17.4 V11.1 H12.8 Z M11.25 12.4 H12.75 V18.2 H11.25 Z"/>
			<path d="M6.2 18.6 C9.8 20.4 14.2 20.4 17.8 18.6 L19.6 21.6 C14.8 23 9.2 23 4.4 21.6 Z"/>
		</symbol>
		<symbol id="filter-icon-weather" viewBox="0 0 24 24" fill="currentColor">
			<polygon points="12.0,1.5 13.3,7.0 17.2,2.9 15.7,8.3 21.1,6.8 17.0,10.7 22.5,12.0 17.0,13.3 21.1,17.2 15.7,15.7 17.2,21.1 13.3,17.0 12.0,22.5 10.7,17.0 6.8,21.1 8.3,15.7 2.9,17.3 7.0,13.3 1.5,12.0 7.0,10.7 2.9,6.7 8.3,8.3 6.7,2.9 10.7,7.0"/>
			<circle cx="12" cy="12" r="5.6"/>
		</symbol>
		<symbol id="filter-icon-special" viewBox="0 0 24 24" fill="currentColor">
			<rect x="11.3" y="1" width="1.4" height="4.2"/>
			<rect x="10" y="2.3" width="4" height="1.2"/>
			<rect x="7" y="5" width="10" height="1.7" rx=".4"/>
			<path fill-rule="evenodd" d="M8 6.6 H16 V17.4 H8 Z M9.3 9.4 a1.1 1.1 0 1 0 2.2 0 a1.1 1.1 0 1 0 -2.2 0 Z M12.5 9.4 a1.1 1.1 0 1 0 2.2 0 a1.1 1.1 0 1 0 -2.2 0 Z M9.3 13.6 a1.1 1.1 0 1 0 2.2 0 a1.1 1.1 0 1 0 -2.2 0 Z M12.5 13.6 a1.1 1.1 0 1 0 2.2 0 a1.1 1.1 0 1 0 -2.2 0 Z"/>
			<rect x="7" y="17.3" width="10" height="1.7" rx=".4"/>
			<rect x="11.2" y="19" width="1.6" height="2"/>
			<rect x="9" y="20.8" width="6" height="1.6" rx=".4"/>
		</symbol>
	</svg>
	<div id="card-bank" class="card-array">
	</div>
	<div id="card-deck" class="card-array">
	</div>
	<div id="card-leader">
		<p data-i18n="leader"></p>
		<div></div>
	</div>
	<div id="deck-stats">
		<p data-i18n="statTotal"></p>
		<p>0</p>
		<p data-i18n="statUnits"></p>
		<p>0</p>
		<p data-i18n="statSpecial"></p>
		<p>0/10</p>
		<p data-i18n="statStrength"></p>
		<p>0</p>
		<p data-i18n="statHeroes"></p>
		<p>0</p>
	</div>
	<button id="start-game" data-i18n="startGame"></button>
	<div id="opponent-preview" class="center">
		<div>
			<p data-i18n="opponentDeck"></p>
		</div>
		<div class="center">
			<button id="op-preview-open" class="hide" data-i18n-title="viewOpponent"></button>
			<div id="op-preview-faction" class="hide"></div>
			<label id="op-preview-leader" for="add-opponent" data-i18n-title="uploadOpponent">
				<input type="file" id="add-opponent" style="display:none;"/>
				<p data-i18n="random"></p>
			</label>
			<button id="op-preview-clear" class="hide" data-i18n-title="clearOpponent"></button>
		</div>
	</div>
</section>

<div data-i18n-title="toggleMusic" id="toggle-music" class="center deck-menu settings-button"><img src="svg/music.svg"></img>
	<section id="music-panel">
		<div class="music-bar">
			<button type="button" tabindex="-1" class="music-btn music-prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
			<button type="button" tabindex="-1" class="music-btn music-play">
				<svg class="music-icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
				<svg class="music-icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
			</button>
			<button type="button" tabindex="-1" class="music-btn music-next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
			<div class="music-now-info">
				<b class="music-now-title"></b>
				<small class="music-now-time"></small>
				<div class="music-progress"><div class="music-progress-fill"></div></div>
			</div>
			<button type="button" tabindex="-1" class="music-btn music-mute">
				<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path class="music-wave-1" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/><path class="music-wave-2" d="M14 3.23v2.06c2.890.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/><path class="music-muted-x" d="M15 9l6 6m0-6l-6 6"/></svg>
			</button>
			<input type="range" class="music-volume" min="0" max="100" step="5">
			<button type="button" tabindex="-1" class="music-btn music-list-toggle"><svg viewBox="0 0 24 24"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm15-3.5V6h4v2h-2v8.5a2.5 2.5 0 1 1-2-2.45z"/></svg></button>
		</div>
		<ol class="music-tracks"></ol>
	</section>
</div>
<div data-i18n-title="settings" id="open-settings" class="center deck-menu settings-button" role="button" tabindex="0" data-i18n-aria="settings"><img src="svg/settings.svg"></img></div>
<!-- In-game fullscreen toggle, next to the gear (the deck menu uses #toggle-fullscreen) -->
<div id="game-fullscreen" class="center deck-menu settings-button" role="button" tabindex="0" data-i18n-title="enterFullscreen" data-i18n-aria="enterFullscreen">
	<svg class="fs-enter" viewBox="0 0 24 24"><path d="M3 3h6v2H5v4H3zm12 0h6v6h-2V5h-4zM3 15h2v4h4v2H3zm16 0h2v6h-6v-2h4z"/></svg>
	<svg class="fs-exit" viewBox="0 0 24 24"><path d="M7 3h2v6H3V7h4zm8 0h2v4h4v2h-6zM3 15h6v6H7v-4H3zm12 0h6v2h-4v4h-2z"/></svg>
</div>

<!-- Settings window, opened from the gear (deck customization menu and in game) -->
<section id="settings-modal" class="hide" role="dialog" aria-modal="true" aria-labelledby="settings-title">
	<div class="settings-window">
		<header class="settings-header">
			<h2 id="settings-title" data-i18n="settings"></h2>
			<button type="button" class="settings-close" data-i18n-aria="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
		</header>
		<nav class="settings-tabs" role="tablist">
			<button type="button" role="tab" data-tab="game" data-i18n="tabGame"></button>
			<button type="button" role="tab" data-tab="audio" data-i18n="tabAudio"></button>
			<button type="button" role="tab" data-tab="language" data-i18n="language"></button>
		</nav>
		<div class="settings-body">
			<section role="tabpanel" data-tab="game">
				<div class="settings-row">
					<div class="settings-label"><span data-i18n="gameMessages"></span><small data-i18n="gameMessagesHint"></small></div>
					<label class="settings-switch"><input type="checkbox" id="setting-notifications" data-i18n-aria="gameMessages"><span></span></label>
				</div>
				<div class="settings-row">
					<div class="settings-label"><span data-i18n="displayFullscreen"></span><small data-i18n="displayFullscreenHint"></small></div>
					<label class="settings-switch"><input type="checkbox" id="setting-fullscreen" data-i18n-aria="displayFullscreen"><span></span></label>
				</div>
			</section>
			<section role="tabpanel" data-tab="audio">
				<div class="settings-row settings-row-audio">
					<div class="settings-label"><span data-i18n="musicLabel"></span><small data-i18n="musicHint"></small></div>
					<label class="settings-switch"><input type="checkbox" id="setting-music" data-i18n-aria="musicLabel"><span></span></label>
					<input type="range" class="settings-slider" id="setting-music-volume" min="0" max="100" step="5" data-i18n-aria="musicVolume">
					<output id="setting-music-value"></output>
				</div>
				<div class="settings-row settings-row-audio">
					<div class="settings-label"><span data-i18n="sfxLabel"></span><small data-i18n="sfxHint"></small></div>
					<label class="settings-switch"><input type="checkbox" id="setting-sfx" data-i18n-aria="sfxLabel"><span></span></label>
					<input type="range" class="settings-slider" id="setting-sfx-volume" min="0" max="100" step="5" data-i18n-aria="sfxVolume">
					<output id="setting-sfx-value"></output>
				</div>
			</section>
			<section role="tabpanel" data-tab="language">
				<div class="settings-row settings-row-top">
					<div class="settings-label"><span data-i18n="language"></span><small data-i18n="languageHint"></small></div>
					<div id="lang-switch" class="settings-options" role="radiogroup" data-i18n-aria="language"></div>
				</div>
			</section>
		</div>
	</div>
</section>

<script type="text/javascript" src="common.js"></script>
<script type="text/javascript" src="cards.js"></script>
<script type="text/javascript" src="lang/i18n.js"></script>
<script type="text/javascript" src="lang/cards/en.js"></script>
<script type="text/javascript" src="lang/cards/es.js"></script>
<script type="text/javascript" src="lang/site/en.js"></script>
<script type="text/javascript" src="lang/site/es.js"></script>
<script type="text/javascript" src="decks.js"></script>
<script type="text/javascript" src="abilities.js"></script>
<script type="text/javascript" src="factions.js"></script>
<script type="text/javascript" src="gwent.js"></script>
<script type="text/javascript" src="music.js"></script>
<script type="text/javascript" src="settings.js"></script>
</body>

</html>
